<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Intersection Shade Field Logger</title>
<style>
:root{--bg:#f6f7f8;--panel:#fff;--text:#111827;--muted:#667085;--line:#d0d5dd;--accent:#174ea6;--good:#067647;--danger:#b42318}*{box-sizing:border-box}body{margin:0 0 92px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}header h1{font-size:19px;margin:0 0 4px}.muted,.help{font-size:12px;color:var(--muted);line-height:1.45}nav{display:flex;gap:8px;overflow:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:69px;z-index:19}nav button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 12px}nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}main{max-width:1500px;margin:auto;padding:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.card h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}textarea{min-height:70px;resize:vertical}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}table{border-collapse:collapse;min-width:1100px;width:100%;font-size:12px}th,td{border:1px solid #e5e7eb;padding:6px;vertical-align:top}th{background:#f9fafb;text-align:left}.count-table{min-width:2050px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--danger)}.exportbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:center;box-shadow:0 -5px 18px rgba(0,0,0,.07)}.exportbar button{font-weight:700;padding:13px 18px;background:var(--good);color:#fff;border-color:var(--good)}.saveState{font-size:12px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}nav{top:76px}main{padding:10px}.exportbar{justify-content:stretch}.exportbar button{flex:1}.saveState{display:none}}
</style></head><body>
<header><h1>Intersection Shade & Crossing Field Logger</h1><div class="muted">Offline-capable. Entries save to this browser automatically. Use the green End Session button before leaving the field.</div></header><nav id="tabs"></nav><main id="app"></main>
<div class="exportbar"><button onclick="endSessionExport()">END SESSION • SAVE MASTER DATA (.json)</button><span class="saveState" id="saveState">Autosave active</span></div>
<script>
const CORNERS=['NE','SE','SW','NW'];const DIRECTIONS=['NE→NW','NE→SE','SE→NE','SE→SW','SW→NW','SW→SE','NW→SW','NW→NE'];
const COUNTS=[['shade_designated','Shade · designated'],['sun_designated','Sun · designated'],['shade_nondesignated','Shade · non-designated'],['sun_nondesignated','Sun · non-designated'],['shade_nd_to_d','Shade · non-designated→designated'],['sun_nd_to_d','Sun · non-designated→designated'],['shade_d_to_nd','Shade · designated→non-designated'],['sun_d_to_nd','Sun · designated→non-designated']];
const blankCorners=()=>Object.fromEntries(CORNERS.map(c=>[c,{waitingGeometry:'',waitingAreaM2:'',svf:'',shadeMethod:'',approachShade:'',photoRef:''}]));
const DEFAULT={schemaVersion:'1.1',intersections:[{id:'I1',name:'24th St & Guadalupe St',lat:'',lng:'',geometry:'4-leg signalized intersection',signalTiming:'Unknown / pending agency timing plan',notes:'Field reconnaissance 8/30/2026. Replace provisional fields with surveyed or agency-confirmed metadata.',corners:blankCorners()},{id:'I2',name:'Intersection 2',lat:'',lng:'',geometry:'',signalTiming:'',notes:'',corners:blankCorners()},{id:'I3',name:'Intersection 3',lat:'',lng:'',geometry:'',signalTiming:'',notes:'',corners:blankCorners()},{id:'I4',name:'Intersection 4',lat:'',lng:'',geometry:'',signalTiming:'',notes:'',corners:blankCorners()}],rows:[],people:[]};
let state=JSON.parse(localStorage.getItem('intersectionShadeLogger')||'null')||DEFAULT;if(!state.people)state.people=[];let active=0;
function save(){localStorage.setItem('intersectionShadeLogger',JSON.stringify(state));const e=document.getElementById('saveState');if(e){e.textContent='Saved locally '+new Date().toLocaleTimeString();setTimeout(()=>e.textContent='Autosave active',1300)}}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderTabs(){document.getElementById('tabs').innerHTML=state.intersections.map((x,i)=>`<button class="${active===i?'active':''}" onclick="active=${i};render()">${esc(x.name||x.id)}</button>`).join('')+`<button class="${active===4?'active':''}" onclick="active=4;render()">Count data</button><button class="${active===5?'active':''}" onclick="active=5;render()">Focal pedestrian</button>`}
function field(i,k,label){return `<label>${label}<input value="${esc(state.intersections[i][k]||'')}" onchange="state.intersections[${i}]['${k}']=this.value;save();renderTabs()"></label>`}
function intersectionTab(i){const x=state.intersections[i];return `<div class="card"><h2>${esc(x.name)}</h2><div class="grid">${field(i,'name','Intersection name')}${field(i,'lat','Latitude')}${field(i,'lng','Longitude')}${field(i,'geometry','Intersection geometry')}${field(i,'signalTiming','Signal phase / timing')}${field(i,'notes','Metadata / source notes')}</div></div><div class="card"><h2>Waiting-area + approach shade geometry</h2><p class="help">Define the waiting-area polygon before observing behavior. Store SVF separately from time-varying shade fraction.</p><div class="table-wrap"><table><thead><tr><th>Corner</th><th>Waiting-area operational geometry</th><th>Area (m²)</th><th>SVF (0–1)</th><th>Shade method</th><th>Approach-route shade</th><th>Photo/file ref.</th></tr></thead><tbody>${CORNERS.map(c=>{const q=x.corners[c];return `<tr><td><b>${c}</b></td><td><textarea onchange="state.intersections[${i}].corners['${c}'].waitingGeometry=this.value;save()">${esc(q.waitingGeometry)}</textarea></td><td><input type="number" min="0" step="0.1" value="${esc(q.waitingAreaM2)}" onchange="state.intersections[${i}].corners['${c}'].waitingAreaM2=this.value;save()"></td><td><input type="number" min="0" max="1" step="0.01" value="${esc(q.svf)}" onchange="state.intersections[${i}].corners['${c}'].svf=this.value;save()"></td><td><textarea onchange="state.intersections[${i}].corners['${c}'].shadeMethod=this.value;save()">${esc(q.shadeMethod)}</textarea></td><td><textarea onchange="state.intersections[${i}].corners['${c}'].approachShade=this.value;save()">${esc(q.approachShade)}</textarea></td><td><input value="${esc(q.photoRef)}" onchange="state.intersections[${i}].corners['${c}'].photoRef=this.value;save()"></td></tr>`}).join('')}</tbody></table></div><p class="help"><b>Shade fraction:</b> shaded area inside the fixed waiting polygon ÷ total waiting-polygon area, evaluated at the observation timestamp.</p></div>`}
function addRow(){state.rows.push({phaseId:'P'+(state.rows.length+1),timestamp:'',intersection:'I1',corner:'NE',direction:'NE→NW',shadeFraction:'',cloud:'',phaseState:'',notes:''});save();render()}
function setRow(i,k,v,count=false){state.rows[i][k]=v;if(count&&v!==''&&!state.rows[i].timestamp)state.rows[i].timestamp=new Date().toISOString();save();render()}
function countRow(r,i){return `<tr><td><input value="${esc(r.phaseId||'')}" onchange="setRow(${i},'phaseId',this.value)"></td><td style="min-width:165px">${esc(r.timestamp||'')}</td><td><select onchange="setRow(${i},'intersection',this.value)">${state.intersections.map(x=>`<option value="${x.id}" ${r.intersection===x.id?'selected':''}>${esc(x.name)}</option>`)}</select></td><td><select onchange="setRow(${i},'corner',this.value)">${CORNERS.map(x=>`<option ${r.corner===x?'selected':''}>${x}</option>`)}</select></td><td><select onchange="setRow(${i},'direction',this.value)">${DIRECTIONS.map(x=>`<option ${r.direction===x?'selected':''}>${x}</option>`)}</select></td><td><select onchange="setRow(${i},'phaseState',this.value)">${['','Designated','Non-designated','Non-designated→designated','Designated→non-designated'].map(x=>`<option ${r.phaseState===x?'selected':''}>${x||'—'}</option>`)}</select></td><td><input type="number" min="0" max="1" step="0.05" value="${esc(r.shadeFraction??'')}" onchange="setRow(${i},'shadeFraction',this.value)"></td><td><select onchange="setRow(${i},'cloud',this.value)">${['','Clear','Mostly clear','Partly cloudy','Mostly cloudy','Overcast'].map(x=>`<option ${r.cloud===x?'selected':''}>${x||'—'}</option>`)}</select></td>${COUNTS.map(([k])=>`<td><input type="number" min="0" step="1" value="${esc(r[k]??'')}" onchange="setRow(${i},'${k}',this.value,true)"></td>`).join('')}<td><input value="${esc(r.notes||'')}" onchange="setRow(${i},'notes',this.value)"></td></tr>`}
function countTab(){return `<div class="card"><h2>Phase-level count data</h2><p class="help"><b>One row = one phase × one origin corner × one direction.</b> Timestamp is created when the first count value is entered. Blank = unobserved; 0 = observed zero.</p><div class="btns"><button class="primary" onclick="addRow()">+ Add phase row</button><button onclick="exportCountsCSV()">Export counts CSV</button></div><div class="table-wrap"><table class="count-table"><thead><tr><th>Phase ID</th><th>Timestamp</th><th>Intersection</th><th>Origin</th><th>Direction</th><th>Phase state</th><th>Shade fraction</th><th>Cloud</th>${COUNTS.map(x=>`<th>${x[1]}</th>`).join('')}<th>Notes</th></tr></thead><tbody>${state.rows.map(countRow).join('')}</tbody></table></div></div>`}
function addPerson(){state.people.push({personId:'F'+(state.people.length+1),phaseId:'',selectedK:'',arrivalOrder:'',intersection:'I1',corner:'NE',direction:'NE→NW',arrivalTime:'',arrivalState:'',crossTime:'',shadeSec:'',sunSec:'',shadeSeeking:'',crossState:'',notes:''});save();render()}
function setP(i,k,v){state.people[i][k]=v;save();render()}
function personRow(r,i){const phases=['','Designated','Non-designated','Non-designated→designated','Designated→non-designated'];return `<tr><td><input value="${esc(r.personId)}" onchange="setP(${i},'personId',this.value)"></td><td><input value="${esc(r.phaseId)}" onchange="setP(${i},'phaseId',this.value)"></td><td><input type="number" min="1" value="${esc(r.selectedK)}" onchange="setP(${i},'selectedK',this.value)"></td><td><input type="number" min="1" value="${esc(r.arrivalOrder)}" onchange="setP(${i},'arrivalOrder',this.value)"></td><td><select onchange="setP(${i},'intersection',this.value)">${state.intersections.map(x=>`<option value="${x.id}" ${r.intersection===x.id?'selected':''}>${esc(x.name)}</option>`)}</select></td><td><select onchange="setP(${i},'corner',this.value)">${CORNERS.map(x=>`<option ${r.corner===x?'selected':''}>${x}</option>`)}</select></td><td><select onchange="setP(${i},'direction',this.value)">${DIRECTIONS.map(x=>`<option ${r.direction===x?'selected':''}>${x}</option>`)}</select></td><td><input type="time" step="1" value="${esc(r.arrivalTime)}" onchange="setP(${i},'arrivalTime',this.value)"></td><td><select onchange="setP(${i},'arrivalState',this.value)">${phases.map(x=>`<option ${r.arrivalState===x?'selected':''}>${x||'—'}</option>`)}</select></td><td><input type="time" step="1" value="${esc(r.crossTime)}" onchange="setP(${i},'crossTime',this.value)"></td><td><input type="number" min="0" value="${esc(r.shadeSec)}" onchange="setP(${i},'shadeSec',this.value)"></td><td><input type="number" min="0" value="${esc(r.sunSec)}" onchange="setP(${i},'sunSec',this.value)"></td><td><select onchange="setP(${i},'shadeSeeking',this.value)">${['','None observed','Sun→shade','Shade→sun','Multiple'].map(x=>`<option ${r.shadeSeeking===x?'selected':''}>${x||'—'}</option>`)}</select></td><td><select onchange="setP(${i},'crossState',this.value)">${['','Designated','Non-designated','Transition'].map(x=>`<option ${r.crossState===x?'selected':''}>${x||'—'}</option>`)}</select></td><td><input value="${esc(r.notes)}" onchange="setP(${i},'notes',this.value)"></td></tr>`}
function personTab(){return `<div class="card"><h2>Optional focal-pedestrian sample</h2><p class="help">Separate person-level table linked by Phase ID. Use a predetermined arrival-order selection rule.</p><div class="btns"><button class="primary" onclick="addPerson()">+ Add focal pedestrian</button><button onclick="exportPeopleCSV()">Export focal CSV</button></div><div class="table-wrap"><table style="min-width:1900px"><thead><tr><th>Person ID</th><th>Phase ID</th><th>Selected k</th><th>Arrival order</th><th>Intersection</th><th>Origin</th><th>Direction</th><th>Arrival time</th><th>Arrival phase</th><th>Crossing time</th><th>Shade sec</th><th>Sun sec</th><th>Shade movement</th><th>Cross state</th><th>Notes</th></tr></thead><tbody>${state.people.map(personRow).join('')}</tbody></table></div></div>`}
function csvEsc(v){return `"${String(v??'').replaceAll('"','""')}"`}function filenameStem(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `shade_field_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`}
function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCountsCSV(){const h=['phase_id','timestamp_iso','intersection_id','intersection_name','origin_corner','direction','phase_state','waiting_area_shade_fraction','cloud_state',...COUNTS.map(x=>x[0]),'notes'];const out=[h];state.rows.forEach(r=>{const x=state.intersections.find(z=>z.id===r.intersection);out.push([r.phaseId,r.timestamp,r.intersection,x?.name||'',r.corner,r.direction,r.phaseState,r.shadeFraction,r.cloud,...COUNTS.map(([k])=>r[k]??''),r.notes])});download(out.map(r=>r.map(csvEsc).join(',')).join('\n'),filenameStem()+'_counts.csv','text/csv')}
function exportPeopleCSV(){const h=['person_id','phase_id','selected_k','arrival_order','intersection_id','origin_corner','direction','arrival_time','arrival_phase_state','crossing_time','shade_seconds','sun_seconds','shade_seeking','crossing_state','notes'];const out=[h,...state.people.map(r=>[r.personId,r.phaseId,r.selectedK,r.arrivalOrder,r.intersection,r.corner,r.direction,r.arrivalTime,r.arrivalState,r.crossTime,r.shadeSec,r.sunSec,r.shadeSeeking,r.crossState,r.notes])];download(out.map(r=>r.map(csvEsc).join(',')).join('\n'),filenameStem()+'_focal.csv','text/csv')}
function endSessionExport(){save();const archive={schema:'intersection-shade-field-logger',schemaVersion:'1.1',exportedAt:new Date().toISOString(),deviceLocalTime:new Date().toString(),data:state};download(JSON.stringify(archive,null,2),filenameStem()+'_MASTER.json','application/json');alert('Master session file saved to this computer. It contains intersection metadata, phase counts, focal-pedestrian records, and timestamps. Keep this JSON as the lossless archive; export CSVs for spreadsheet/statistical analysis.')}
function render(){renderTabs();document.getElementById('app').innerHTML=active<4?intersectionTab(active):active===4?countTab():personTab()}render();
</script></body></html>
