<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Intersection Shade Field Logger</title><style>:root{--bg:#f6f7f8;--panel:#fff;--text:#111827;--muted:#667085;--line:#d0d5dd;--accent:#174ea6;--good:#067647;--danger:#b42318}*{box-sizing:border-box}body{margin:0 0 92px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}header h1{font-size:19px;margin:0 0 4px}.muted,.help{font-size:12px;color:var(--muted);line-height:1.45}nav{display:flex;gap:8px;overflow:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:69px;z-index:19}nav button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 12px}nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}main{max-width:1500px;margin:auto;padding:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.card h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}textarea{min-height:70px;resize:vertical}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}table{border-collapse:collapse;min-width:1100px;width:100%;font-size:12px}th,td{border:1px solid #e5e7eb;padding:6px;vertical-align:top}th{background:#f9fafb;text-align:left}.count-table{min-width:1900px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{background:#fff5f5;color:var(--danger);border-color:#f0b4b4}.exportbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:center;box-shadow:0 -5px 18px rgba(0,0,0,.07)}.exportbar button{font-weight:700;padding:13px 18px;background:var(--good);color:#fff;border-color:var(--good)}.saveState{font-size:12px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}nav{top:76px}main{padding:10px}.exportbar{justify-content:stretch}.exportbar button{flex:1}.saveState{display:none}}</style></head><body><header><h1>Intersection Shade & Crossing Field Logger</h1><div class="muted">Offline-capable. Entries autosave locally. Export before ending a session.</div></header><nav id="tabs"></nav><main id="app"></main><div class="exportbar"><button onclick="endSessionExport()">END SESSION • SAVE MASTER DATA (.json)</button><span class="saveState" id="saveState">Autosave active</span></div><script>const CORNERS=['NE','SE','SW','NW'];const DIRECTIONS=['NE→NW','NE→SE','SE→NE','SE→SW','SW→NW','SW→SE','NW→SW','NW→NE'];const COUNTS=[['shade_designated','Shade · designated'],['sun_designated','Sun · designated'],['shade_nondesignated','Shade · non-designated'],['sun_nondesignated','Sun · non-designated'],['shade_nd_to_d','Shade · non-designated→designated'],['sun_nd_to_d','Sun · non-designated→designated'],['shade_d_to_nd','Shade · designated→non-designated'],['sun_d_to_nd','Sun · designated→non-designated']];const blankCorners=()=>Object.fromEntries(CORNERS.map(c=>[c,{waitingGeometry:'',waitingAreaM2:'',svf:'',shadeMethod:'',approachShade:'',photoRef:''}]));const DEFAULT={schemaVersion:'1.4',intersections:[{id:'I1',name:'24th St & Guadalupe St',lat:'',lng:'',geometry:'4-leg signalized intersection',signalTiming:'Unknown / pending agency timing plan',notes:'',corners:blankCorners()},{id:'I2',name:'21st St & Guadalupe St',lat:'',lng:'',geometry:'4-leg signalized intersection',signalTiming:'Unknown / pending agency timing plan',notes:'',corners:blankCorners()},{id:'I3',name:'MLK Jr Blvd & Guadalupe St',lat:'',lng:'',geometry:'4-leg signalized intersection',signalTiming:'Unknown / pending agency timing plan',notes:'',corners:blankCorners()},{id:'I4',name:'E Dean Keeton St & San Jacinto Blvd',lat:'',lng:'',geometry:'4-leg signalized intersection',signalTiming:'Unknown / pending agency timing plan',notes:'',corners:blankCorners()}],rows:[]};let state=JSON.parse(localStorage.getItem('intersectionShadeLogger')||'null')||DEFAULT;if(!state.rows)state.rows=[];delete state.people;DEFAULT.intersections.forEach((d,i)=>{if(!state.intersections[i])state.intersections[i]=d;state.intersections[i].id=d.id;state.intersections[i].name=d.name;if(!state.intersections[i].corners)state.intersections[i].corners=blankCorners()});state.schemaVersion='1.4';let active=Number(localStorage.getItem('intersectionShadeActiveTab')||0);if(!Number.isInteger(active)||active<0||active>4)active=0;function selectTab(i){active=i;localStorage.setItem('intersectionShadeActiveTab',String(i));render()}function save(){localStorage.setItem('intersectionShadeLogger',JSON.stringify(state));const e=document.getElementById('saveState');if(e){e.textContent='Saved locally '+new Date().toLocaleTimeString();setTimeout(()=>e.textContent='Autosave active',1200)}}function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function renderTabs(){document.getElementById('tabs').innerHTML=state.intersections.map((x,i)=>`<button class="${active===i?'active':''}" onclick="selectTab(${i})">${esc(x.name||x.id)}</button>`).join('')+`<button class="${active===4?'active':''}" onclick="selectTab(4)">Count data</button>`}function field(i,k,label){return `<label>${label}<input value="${esc(state.intersections[i][k]||'')}" onchange="state.intersections[${i}]['${k}']=this.value;save();renderTabs()"></label>`}function intersectionTab(i){const x=state.intersections[i];return `<div class="card"><h2>${esc(x.name)}</h2><div class="grid">${field(i,'name','Intersection name')}${field(i,'lat','Latitude')}${field(i,'lng','Longitude')}${field(i,'geometry','Intersection geometry')}${field(i,'signalTiming','Signal phase / timing')}${field(i,'notes','Metadata / source notes')}</div></div><div class="card"><h2>Waiting-area + approach shade geometry</h2><p class="help">Define the waiting-area polygon before observing behavior. Store SVF separately from time-varying shade fraction.</p><div class="table-wrap"><table><thead><tr><th>Corner</th><th>Waiting-area geometry</th><th>Area (m²)</th><th>SVF</th><th>Shade method</th><th>Approach-route shade</th><th>Photo/file ref.</th></tr></thead><tbody>${CORNERS.map(c=>{const q=x.corners[c];return `<tr><td><b>${c}</b></td><td><textarea onchange="state.intersections[${i}].corners['${c}'].waitingGeometry=this.value;save()">${esc(q.waitingGeometry)}</textarea></td><td><input type="number" min="0" step="0.1" value="${esc(q.waitingAreaM2)}" onchange="state.intersections[${i}].corners['${c}'].waitingAreaM2=this.value;save()"></td><td><input type="number" min="0" max="1" step="0.01" value="${esc(q.svf)}" onchange="state.intersections[${i}].corners['${c}'].svf=this.value;save()"></td><td><textarea onchange="state.intersections[${i}].corners['${c}'].shadeMethod=this.value;save()">${esc(q.shadeMethod)}</textarea></td><td><textarea onchange="state.intersections[${i}].corners['${c}'].approachShade=this.value;save()">${esc(q.approachShade)}</textarea></td><td><input value="${esc(q.photoRef)}" onchange="state.intersections[${i}].corners['${c}'].photoRef=this.value;save()"></td></tr>`}).join('')}</tbody></table></div><p class="help"><b>Shade fraction:</b> shaded area inside fixed waiting polygon ÷ total waiting-polygon area at observation time.</p></div>`}function addRow(){state.rows.push({phaseId:'P'+(state.rows.length+1),timestamp:'',intersection:'I1',corner:'NE',direction:'NE→NW',shadeFraction:'',cloud:'',notes:''});save();render()}function clearCountTable(){if(!state.rows.length){alert('Count table is already empty.');return}if(confirm('Clear ALL count-data rows? This cannot be undone unless you exported a backup.')){state.rows=[];save();render()}}function setRow(i,k,v,count=false){state.rows[i][k]=v;if(count&&v!==''&&!state.rows[i].timestamp)state.rows[i].timestamp=new Date().toISOString();save();render()}function countRow(r,i){return `<tr><td><input value="${esc(r.phaseId||'')}" onchange="setRow(${i},'phaseId',this.value)"></td><td style="min-width:165px">${esc(r.timestamp||'')}</td><td><select onchange="setRow(${i},'intersection',this.value)">${state.intersections.map(x=>`<option value="${x.id}" ${r.intersection===x.id?'selected':''}>${esc(x.name)}</option>`)}</select></td><td><select onchange="setRow(${i},'corner',this.value)">${CORNERS.map(x=>`<option ${r.corner===x?'selected':''}>${x}</option>`)}</select></td><td><select onchange="setRow(${i},'direction',this.value)">${DIRECTIONS.map(x=>`<option ${r.direction===x?'selected':''}>${x}</option>`)}</select></td><td><input type="number" min="0" max="1" step="0.05" value="${esc(r.shadeFraction??'')}" onchange="setRow(${i},'shadeFraction',this.value)"></td><td><select onchange="setRow(${i},'cloud',this.value)">${['','Clear','Mostly clear','Partly cloudy','Mostly cloudy','Overcast'].map(x=>`<option ${r.cloud===x?'selected':''}>${x||'—'}</option>`)}</select></td>${COUNTS.map(([k])=>`<td><input type="number" min="0" step="1" value="${esc(r[k]??'')}" onchange="setRow(${i},'${k}',this.value,true)"></td>`).join('')}<td><input value="${esc(r.notes||'')}" onchange="setRow(${i},'notes',this.value)"></td></tr>`}function countTab(){return `<div class="card"><h2>Phase-level count data</h2><p class="help"><b>One row = one signal phase × one origin corner × one direction.</b> The crossing-state information is encoded directly in the eight count columns. Timestamp is created when the first count is entered.</p><div class="btns"><button class="primary" onclick="addRow()">+ Add phase row</button><button onclick="exportCountsCSV()">Export counts CSV</button><button class="danger" onclick="clearCountTable()">CLEAR / RESET COUNT TABLE</button></div><div class="table-wrap"><table class="count-table"><thead><tr><th>Phase ID</th><th>Timestamp</th><th>Intersection</th><th>Origin</th><th>Direction</th><th>Shade fraction</th><th>Cloud</th>${COUNTS.map(x=>`<th>${x[1]}</th>`).join('')}<th>Notes</th></tr></thead><tbody>${state.rows.map(countRow).join('')}</tbody></table></div></div>`}function csvEscape(v){return `"${String(v??'').replaceAll('"','""')}"`}function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportCountsCSV(){const h=['phase_id','timestamp_iso','intersection_id','intersection_name','origin_corner','direction','waiting_area_shade_fraction','cloud_state',...COUNTS.map(x=>x[0]),'notes'];const rows=[h];state.rows.forEach(r=>{const x=state.intersections.find(z=>z.id===r.intersection);rows.push([r.phaseId,r.timestamp,r.intersection,x?.name||'',r.corner,r.direction,r.shadeFraction,r.cloud,...COUNTS.map(([k])=>r[k]??''),r.notes])});download(rows.map(x=>x.map(csvEscape).join(',')).join('\n'),'intersection_counts.csv','text/csv')}function endSessionExport(){const now=new Date(),stamp=now.toISOString().replace(/[:T]/g,'-').slice(0,19);const out={...state,activeTab:active,exportedAtISO:now.toISOString(),exportedAtLocal:now.toString()};download(JSON.stringify(out,null,2),`shade_field_${stamp}_MASTER.json`,'application/json')}function render(){renderTabs();document.getElementById('app').innerHTML=active<4?intersectionTab(active):countTab()}save();render();</script></body></html>
