<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Field data collection interface for shade, pedestrian waiting exposure, and crossing behavior at signalized intersections.">
<title>Intersection Shade Field Logger</title>
<style>
:root{--bg:#f6f7f8;--panel:#fff;--text:#111827;--muted:#667085;--line:#d0d5dd;--accent:#174ea6;--soft:#eef4ff;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}header h1{font-size:19px;margin:0 0 4px}.muted{font-size:12px;color:var(--muted)}nav{display:flex;gap:8px;overflow:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:69px;z-index:19}nav button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 12px}nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}main{max-width:1500px;margin:auto;padding:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.card h2{font-size:17px;margin:0 0 10px}.card h3{font-size:14px;margin:12px 0 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;color:var(--text)}textarea{min-height:70px;resize:vertical}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}table{border-collapse:collapse;min-width:1100px;width:100%;font-size:12px}th,td{border:1px solid #e5e7eb;padding:6px;vertical-align:top}th{background:#f9fafb;text-align:left}.count-table{min-width:2050px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--danger)}.help{font-size:12px;color:var(--muted);line-height:1.5}.pill{display:inline-block;background:var(--soft);color:#3538cd;padding:3px 7px;border-radius:999px;font-size:11px}.status{font-size:12px;color:#067647;min-height:18px}.split-note{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafafa}@media(max-width:800px){.grid,.split-note{grid-template-columns:1fr}nav{top:76px}main{padding:10px}.card{padding:11px}}
</style>
</head>
<body>
<header><h1>Intersection Shade & Crossing Field Logger</h1><div class="muted">Four intersection metadata tabs + phase-level count data + optional focal-pedestrian sampling. Data are stored locally in this browser until exported.</div></header>
<nav id="tabs"></nav>
<main id="app"></main>
<script>
const CORNERS=['NE','SE','SW','NW'];
const DIRECTIONS=['NE→NW','NE→SE','SE→NE','SE→SW','SW→NW','SW→SE','NW→SW','NW→NE'];
const COUNTS=[['shade_designated','Shade · designated'],['sun_designated','Sun · designated'],['shade_nondesignated','Shade · non-designated'],['sun_nondesignated','Sun · non-designated'],['shade_nd_to_d','Shade · non-designated→designated'],['sun_nd_to_d','Sun · non-designated→designated'],['shade_d_to_nd','Shade · designated→non-designated'],['sun_d_to_nd','Sun · designated→non-designated']];
const blankCorners=()=>Object.fromEntries(CORNERS.map(c=>[c,{waitingGeometry:'',waitingAreaM2:'',svf:'',shadeMethod:'',approachShade:'',photoRef:''}]));
const DEFAULT={intersections:[{id:'I1',name:'24th St & Guadalupe St',lat:'',lng:'',geometry:'4-leg signalized intersection',signalTiming:'Unknown / pending agency timing plan',notes:'Field reconnaissance 8/30/2026. Replace provisional fields with surveyed or agency-confirmed metadata.',corners:blankCorners()},{id:'I2',name:'Intersection 2',lat:'',lng:'',geometry:'',signalTiming:'',notes:'',corners:blankCorners()},{id:'I3',name:'Intersection 3',lat:'',lng:'',geometry:'',signalTiming:'',notes:'',corners:blankCorners()},{id:'I4',name:'Intersection 4',lat:'',lng:'',geometry:'',signalTiming:'',notes:'',corners:blankCorners()}],rows:[],people:[]};
let state=JSON.parse(localStorage.getItem('intersectionShadeLogger')||'null')||DEFAULT;if(!state.people)state.people=[];let active=0;
function save(){localStorage.setItem('intersectionShadeLogger',JSON.stringify(state));let s=document.querySelector('.status');if(s){s.textContent='Saved locally';setTimeout(()=>{if(s)s.textContent=''},800)}}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderTabs(){document.getElementById('tabs').innerHTML=state.intersections.map((x,i)=>`<button class="${active===i?'active':''}" onclick="active=${i};render()">${esc(x.name||x.id)}</button>`).join('')+`<button class="${active===4?'active':''}" onclick="active=4;render()">Count data</button><button class="${active===5?'active':''}" onclick="active=5;render()">Focal pedestrian</button>`}
function field(i,k,label){return `<label>${label}<input value="${esc(state.intersections[i][k]||'')}" onchange="state.intersections[${i}]['${k}']=this.value;save();renderTabs()"></label>`}
function intersectionTab(i){const x=state.intersections[i];return `<div class="card"><h2>${esc(x.name)}</h2><div class="grid">${field(i,'name','Intersection name')}${field(i,'lat','Latitude')}${field(i,'lng','Longitude')}${field(i,'geometry','Intersection geometry')}${field(i,'signalTiming','Signal phase / timing')}${field(i,'notes','Metadata / source notes')}</div></div><div class="card"><h2>Waiting-area + approach shade geometry</h2><p class="help"><span class="pill">Measurement rule</span> Define the waiting-area polygon before observing behavior. Store Sky View Factor separately from time-varying shade fraction. SVF is a geometric descriptor; direct solar shade changes with solar position.</p><div class="table-wrap"><table><thead><tr><th>Corner</th><th>Waiting-area operational geometry</th><th>Waiting area (m²)</th><th>SVF (0–1)</th><th>Shade measurement method</th><th>Approach-route shade geometry</th><th>Photo / file reference</th></tr></thead><tbody>${CORNERS.map(c=>{const q=x.corners[c];return `<tr><td><b>${c}</b></td><td><textarea onchange="state.intersections[${i}].corners['${c}'].waitingGeometry=this.value;save()">${esc(q.waitingGeometry)}</textarea></td><td><input type="number" min="0" step="0.1" value="${esc(q.waitingAreaM2)}" onchange="state.intersections[${i}].corners['${c}'].waitingAreaM2=this.value;save()"></td><td><input type="number" min="0" max="1" step="0.01" value="${esc(q.svf)}" onchange="state.intersections[${i}].corners['${c}'].svf=this.value;save()"></td><td><textarea onchange="state.intersections[${i}].corners['${c}'].shadeMethod=this.value;save()">${esc(q.shadeMethod)}</textarea></td><td><textarea onchange="state.intersections[${i}].corners['${c}'].approachShade=this.value;save()">${esc(q.approachShade)}</textarea></td><td><input value="${esc(q.photoRef)}" onchange="state.intersections[${i}].corners['${c}'].photoRef=this.value;save()"></td></tr>`}).join('')}</tbody></table></div></div><div class="card"><h2>Operational definition</h2><div class="split-note"><div class="mini"><b>Waiting area</b><p class="help">Use a fixed, pre-declared polygon tied to physical infrastructure: curb line, associated crosswalk entrance(s), curb-ramp/landing geometry, sidewalk edges, permanent barriers, and clearly excluded through-space. Do not redraw it around where people happened to stand.</p></div><div class="mini"><b>Timestamped shade fraction</b><p class="help">Shade fraction = shaded area within the fixed waiting polygon ÷ total waiting-polygon area. Record it at the phase timestamp, ideally from repeatable photographs, GIS/shadow modeling, or a documented manual method.</p></div></div></div>`}
function addRow(){state.rows.push({phaseId:'P'+(state.rows.length+1),timestamp:'',intersection:'I1',corner:'NE',direction:'NE→NW',shadeFraction:'',cloud:'',phaseState:'',notes:''});save();render()}
function setRow(i,k,v,count=false){state.rows[i][k]=v;if(count&&v!==''&&!state.rows[i].timestamp)state.rows[i].timestamp=new Date().toISOString();save();render()}
function countRow(r,i){return `<tr><td><input value="${esc(r.phaseId||'')}" onchange="setRow(${i},'phaseId',this.value)"></td><td style="min-width:165px">${esc(r.timestamp||'')}</td><td><select onchange="setRow(${i},'intersection',this.value)">${state.intersections.map(x=>`<option value="${x.id}" ${r.intersection===x.id?'selected':''}>${esc(x.name)}</option>`)}</select></td><td><select onchange="setRow(${i},'corner',this.value)">${CORNERS.map(x=>`<option ${r.corner===x?'selected':''}>${x}</option>`)}</select></td><td><select onchange="setRow(${i},'direction',this.value)">${DIRECTIONS.map(x=>`<option ${r.direction===x?'selected':''}>${x}</option>`)}</select></td><td><select onchange="setRow(${i},'phaseState',this.value)">${['','Designated','Non-designated','Non-designated→designated','Designated→non-designated'].map(x=>`<option ${r.phaseState===x?'selected':''}>${x||'—'}</option>`)}</select></td><td><input type="number" min="0" max="1" step="0.05" value="${esc(r.shadeFraction??'')}" onchange="setRow(${i},'shadeFraction',this.value)"></td><td><select onchange="setRow(${i},'cloud',this.value)">${['','Clear','Mostly clear','Partly cloudy','Mostly cloudy','Overcast'].map(x=>`<option ${r.cloud===x?'selected':''}>${x||'—'}</option>`)}</select></td>${COUNTS.map(([k])=>`<td><input type="number" min="0" step="1" value="${esc(r[k]??'')}" onchange="setRow(${i},'${k}',this.value,true)"></td>`).join('')}<td><input value="${esc(r.notes||'')}" onchange="setRow(${i},'notes',this.value)"></td><td><button class="danger" onclick="state.rows.splice(${i},1);save();render()">×</button></td></tr>`}
function countTab(){return `<div class="card"><h2>Phase-level count data</h2><p class="help"><b>Observation unit:</b> one signal phase × one origin corner × one crossing direction. The timestamp auto-populates the first time any count is entered. Blank = not observed; 0 = observed zero.</p><div class="btns"><button class="primary" onclick="addRow()">+ Add phase row</button><button onclick="exportCSV()">Export CSV</button><button onclick="exportJSON()">JSON backup</button></div><div class="status"></div><div class="table-wrap"><table class="count-table"><thead><tr><th>Phase ID</th><th>Timestamp</th><th>Intersection</th><th>Origin corner</th><th>Direction</th><th>Phase state</th><th>Waiting-area shade fraction</th><th>Cloud state</th>${COUNTS.map(x=>`<th>${x[1]}</th>`).join('')}<th>Notes</th><th></th></tr></thead><tbody>${state.rows.map(countRow).join('')}</tbody></table></div></div>`}
function addPerson(){state.people.push({personId:'F'+(state.people.length+1),phaseId:'',selectedK:'',arrivalOrder:'',intersection:'I1',corner:'NE',direction:'NE→NW',arrivalTime:'',arrivalState:'',crossTime:'',shadeSec:'',sunSec:'',shadeSeeking:'',crossState:'',notes:''});save();render()}
function setP(i,k,v){state.people[i][k]=v;save();render()}
function personRow(r,i){return `<tr><td><input value="${esc(r.personId)}" onchange="setP(${i},'personId',this.value)"></td><td><input value="${esc(r.phaseId)}" onchange="setP(${i},'phaseId',this.value)"></td><td><input type="number" min="1" step="1" value="${esc(r.selectedK)}" onchange="setP(${i},'selectedK',this.value)"></td><td><input type="number" min="1" step="1" value="${esc(r.arrivalOrder)}" onchange="setP(${i},'arrivalOrder',this.value)"></td><td><select onchange="setP(${i},'intersection',this.value)">${state.intersections.map(x=>`<option value="${x.id}" ${r.intersection===x.id?'selected':''}>${esc(x.name)}</option>`)}</select></td><td><select onchange="setP(${i},'corner',this.value)">${CORNERS.map(x=>`<option ${r.corner===x?'selected':''}>${x}</option>`)}</select></td><td><select onchange="setP(${i},'direction',this.value)">${DIRECTIONS.map(x=>`<option ${r.direction===x?'selected':''}>${x}</option>`)}</select></td><td><input type="time" step="1" value="${esc(r.arrivalTime)}" onchange="setP(${i},'arrivalTime',this.value)"></td><td><select onchange="setP(${i},'arrivalState',this.value)">${['','Designated','Non-designated','Non-designated→designated','Designated→non-designated'].map(x=>`<option ${r.arrivalState===x?'selected':''}>${x||'—'}</option>`)}</select></td><td><input type="time" step="1" value="${esc(r.crossTime)}" onchange="setP(${i},'crossTime',this.value)"></td><td><input type="number" min="0" step="1" value="${esc(r.shadeSec)}" onchange="setP(${i},'shadeSec',this.value)"></td><td><input type="number" min="0" step="1" value="${esc(r.sunSec)}" onchange="setP(${i},'sunSec',this.value)"></td><td><select onchange="setP(${i},'shadeSeeking',this.value)">${['','None observed','Sun→shade','Shade→sun','Multiple'].map(x=>`<option ${r.shadeSeeking===x?'selected':''}>${x||'—'}</option>`)}</select></td><td><select onchange="setP(${i},'crossState',this.value)">${['','Designated','Non-designated','Transition'].map(x=>`<option ${r.crossState===x?'selected':''}>${x||'—'}</option>`)}</select></td><td><input value="${esc(r.notes)}" onchange="setP(${i},'notes',this.value)"></td><td><button class="danger" onclick="state.people.splice(${i},1);save();render()">×</button></td></tr>`}
function personTab(){return `<div class="card"><h2>Optional focal-pedestrian sample</h2><p class="help">Keep this separate from the aggregate phase table. Use a predetermined selection rule, e.g. randomly choose k∈{1,2,3} before the phase and track the kth eligible pedestrian arriving in the selected direction. This avoids choosing based on shade/sun status while preserving phase-wide aggregate counts elsewhere.</p><div class="btns"><button class="primary" onclick="addPerson()">+ Add focal pedestrian</button></div><div class="table-wrap"><table style="min-width:1900px"><thead><tr><th>Person ID</th><th>Phase ID</th><th>Predetermined k</th><th>Observed arrival order</th><th>Intersection</th><th>Origin</th><th>Direction</th><th>Arrival time</th><th>Arrival phase state</th><th>Crossing time</th><th>Seconds shade</th><th>Seconds sun</th><th>Shade-seeking movement</th><th>Crossing state</th><th>Notes</th><th></th></tr></thead><tbody>${state.people.map(personRow).join('')}</tbody></table></div></div>`}
function csvEscape(v){return `"${String(v??'').replaceAll('"','""')}"`}
function exportCSV(){const h=['phase_id','timestamp_iso','intersection_id','intersection_name','origin_corner','direction','phase_state','waiting_area_shade_fraction','cloud_state',...COUNTS.map(x=>x[0]),'notes'];const rows=[h];state.rows.forEach(r=>{const x=state.intersections.find(z=>z.id===r.intersection);rows.push([r.phaseId,r.timestamp,r.intersection,x?.name||'',r.corner,r.direction,r.phaseState,r.shadeFraction,r.cloud,...COUNTS.map(([k])=>r[k]??''),r.notes])});download(rows.map(row=>row.map(csvEscape).join(',')).join('\n'),'intersection_counts.csv','text/csv')}
function exportJSON(){download(JSON.stringify(state,null,2),'intersection_field_logger_backup.json','application/json')}
function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){renderTabs();document.getElementById('app').innerHTML=active<4?intersectionTab(active):active===4?countTab():personTab()}
render();
</script>
</body>
</html>
